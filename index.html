    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

          padding: 2mm !important;
          box-sizing: border-box !important;
          background: white !important;
          color: black !important;
        }
        @page {
          size: 50mm 30mm;
          margin: 0;
        }
      }
